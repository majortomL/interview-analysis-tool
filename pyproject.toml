[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "interview-analysis-tool"
version = "0.1.0"
description = "A local-first workflow for interview transcription, review, and reflexive thematic analysis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tom Lautenbach" }]
keywords = ["interviews", "transcription", "thematic-analysis", "qualitative-research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "Flask>=3.0,<4",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0,<2"]
diarization = ["faster-whisper>=1.0,<2", "pyannote.audio>=3.1,<4"]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
interview-analysis = "interview_analysis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_analysis"]

[tool.hatch.build.targets.sdist]
include = ["src/interview_analysis", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
